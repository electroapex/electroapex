<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 775 140" width="100%" height="100%" style="border-radius: 8px;">
<defs>

        <clipPath id="clip-line-0">
            <rect x="25" y="44" height="22" width="0">
                <animate attributeName="width" from="0" to="530.4" dur="2.0s" begin="0.2s" fill="freeze" />
            </rect>
        </clipPath>
        

        <clipPath id="clip-line-1">
            <rect x="25" y="69" height="22" width="0">
                <animate attributeName="width" from="0" to="397.8" dur="2.0s" begin="2.4s" fill="freeze" />
            </rect>
        </clipPath>
        

        <clipPath id="clip-line-2">
            <rect x="25" y="94" height="22" width="0">
                <animate attributeName="width" from="0" to="468.0" dur="2.0s" begin="4.6s" fill="freeze" />
            </rect>
        </clipPath>
        
</defs>

<style>

@font-face {
    font-family: 'JetBrains Mono';
    src: url(data:font/woff2;charset=utf-8;base64,) format('woff2');
    font-weight: normal;
    font-style: normal;
}


:root {
    --bg: #0d1117;
    --bg-card: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --accent-green: #3fb950;
    --accent-purple: #bc8cff;
    --accent-orange: #f0883e;
    --sparkline: #58a6ff;
    --sparkline-fill: rgba(88, 166, 255, 0.1);
}

/* Light mode override */
@media (prefers-color-scheme: light) {
    :root {
        --bg: #ffffff;
        --bg-card: #f6f8fa;
        --border: #d0d7de;
        --text: #24292f;
        --text-muted: #57606a;
        --accent: #0969da;
        --accent-green: #1a7f37;
        --accent-purple: #8250df;
        --accent-orange: #bc4c00;
        --sparkline: #0969da;
        --sparkline-fill: rgba(9, 105, 218, 0.1);
    }
}

body {
    font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
    margin: 0;
}

.card {
    fill: var(--bg-card);
    stroke: var(--border);
    stroke-width: 1px;
    rx: 8px;
}

.title {
    font-size: 16px;
    font-weight: 600;
    fill: var(--accent);
}

.label {
    font-size: 13px;
    fill: var(--text-muted);
}

.value {
    font-size: 13px;
    font-weight: 600;
    fill: var(--text);
}


    .terminal-body {
        fill: var(--bg-card);
        stroke: var(--border);
        stroke-width: 1px;
        rx: 8px;
    }
    .terminal-header {
        fill: #161b22;
        stroke: var(--border);
        stroke-width: 1px;
    }
    .terminal-dot {
        r: 6px;
    }
    .terminal-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        fill: var(--text);
    }
    .terminal-cursor {
        fill: var(--accent);
    }
    
</style>

    <rect x="0.5" y="0.5" width="774" height="139" class="terminal-body" />
    <path d="M 0.5,8 A 8,8 0 0,1 8,0.5 L 767,0.5 A 8,8 0 0,1 774.5,8 L 774.5,30 L 0.5,30 Z" class="terminal-header" />
    <circle cx="20" cy="15" class="terminal-dot" fill="#ff5f56" />
    <circle cx="40" cy="15" class="terminal-dot" fill="#ffbd2e" />
    <circle cx="60" cy="15" class="terminal-dot" fill="#27c93f" />
    <text x="387" y="20" fill="var(--text-muted)" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">bash - electroapex@terminal</text>
    

        <text x="25" y="58" class="terminal-text" clip-path="url(#clip-line-0)">⚡ Passionate about full stack web development and problem solving...</text>
        

        <rect x="25" y="46" width="8" height="14" class="terminal-cursor">
            
            <animate attributeName="visibility" from="hidden" to="visible" begin="0.2s" dur="2.1999999999999997s" fill="freeze" />
            <animate attributeName="visibility" to="hidden" begin="2.4s" fill="freeze" />
            
            <animate attributeName="x" from="25" to="555.4" begin="0.2s" dur="2.0s" fill="freeze" />
            <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="2.2s" />
        </rect>
        

        <text x="25" y="83" class="terminal-text" clip-path="url(#clip-line-1)">💻 React, TypeScript, PHP, Python, C++, SQL, Rust...</text>
        

        <rect x="25" y="71" width="8" height="14" class="terminal-cursor">
            
            <animate attributeName="visibility" from="hidden" to="visible" begin="2.4s" dur="2.1999999999999997s" fill="freeze" />
            <animate attributeName="visibility" to="hidden" begin="4.6s" fill="freeze" />
            
            <animate attributeName="x" from="25" to="422.8" begin="2.4s" dur="2.0s" fill="freeze" />
            <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="4.4s" />
        </rect>
        

        <text x="25" y="108" class="terminal-text" clip-path="url(#clip-line-2)">🚀 Turning complex ideas into elegant, production-ready code.</text>
        

        <rect x="25" y="96" width="8" height="14" class="terminal-cursor">
            
            <animate attributeName="visibility" from="hidden" to="visible" begin="4.6s" fill="freeze" />
            
            <animate attributeName="x" from="25" to="493.0" begin="4.6s" dur="2.0s" fill="freeze" />
            <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="6.6s" />
        </rect>
        
</svg>