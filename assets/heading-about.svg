<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 55" width="100%" height="100%" style="border-radius: 8px;">
<defs>

    <linearGradient id="card-bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="var(--bg-card)" stop-opacity="0.95" />
        <stop offset="100%" stop-color="var(--bg-card)" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="card-border-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.2)" />
        <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
        

    <linearGradient id="heading-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity="1" />
        <stop offset="40%" stop-color="var(--accent-purple)" stop-opacity="0.8" />
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0" />
    </linearGradient>
    
</defs>

<style>

@font-face {
    font-family: 'JetBrains Mono';
    src: url(data:font/woff2;charset=utf-8;base64,) format('woff2');
    font-weight: normal;
    font-style: normal;
}


:root {
    --bg: #000000;
    --bg-card: #0F0F11;
    --border: #262628;
    --text: #EEEEEE;
    --text-muted: #8A8F98;
    --accent: #5E6AD2;
    --accent-green: #4DA269;
    --accent-purple: #8A63D2;
    --accent-orange: #E36C2F;
    --sparkline: #5E6AD2;
    --sparkline-fill: rgba(94, 106, 210, 0.1);
}

/* Light mode override */
@media (prefers-color-scheme: light) {
    :root {
        --bg: #FFFFFF;
        --bg-card: #F7F7F9;
        --border: #EBEBEF;
        --text: #111113;
        --text-muted: #687076;
        --accent: #5E6AD2;
        --accent-green: #2F8E4B;
        --accent-purple: #793EE8;
        --accent-orange: #C54E00;
        --sparkline: #5E6AD2;
        --sparkline-fill: rgba(94, 106, 210, 0.1);
    }
}

body {
    font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
    margin: 0;
}

.card {
    fill: url(#card-bg-grad);
    stroke: url(#card-border-grad);
    stroke-width: 1.5px;
    rx: 12px;
    filter: url(#shadow3d);
}

.title {
    font-size: 16px;
    font-weight: 600;
    fill: var(--accent);
}

.label {
    font-size: 13px;
    fill: var(--text-muted);
}

.value {
    font-size: 13px;
    font-weight: 600;
    fill: var(--text);
}


    .heading-text {
        font-family: 'JetBrains Mono', -apple-system, sans-serif;
        font-size: 22px;
        font-weight: 700;
        fill: var(--text);
    }
    .heading-prefix {
        font-family: 'JetBrains Mono', -apple-system, sans-serif;
        font-size: 22px;
        font-weight: 700;
        fill: var(--accent);
    }
    .heading-line {
        stroke: url(#heading-grad);
        stroke-width: 3px;
        stroke-linecap: round;
        stroke-dasharray: 300;
        stroke-dashoffset: 300;
        animation: drawUnderline 1.2s ease-out forwards;
    }
    @keyframes drawUnderline {
        to { stroke-dashoffset: 0; }
    }
    
</style>

    <text x="10" y="32">
        <tspan class="heading-prefix">## </tspan>
        <tspan class="heading-text">About Me</tspan>
    </text>
    <line x1="10" y1="42" x2="190" y2="42" class="heading-line" />
    
</svg>