<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 775 30" width="100%" height="100%" style="border-radius: 8px;">
<defs>

    <linearGradient id="card-bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="var(--bg-card)" stop-opacity="0.95" />
        <stop offset="100%" stop-color="var(--bg-card)" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="card-border-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.2)" />
        <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
        

    <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="var(--border)" stop-opacity="0.2" />
        <stop offset="30%" stop-color="var(--accent)" stop-opacity="0.8" />
        <stop offset="50%" stop-color="var(--accent-purple)" stop-opacity="1" />
        <stop offset="70%" stop-color="var(--accent)" stop-opacity="0.8" />
        <stop offset="100%" stop-color="var(--border)" stop-opacity="0.2" />
    </linearGradient>
    
    <filter id="pulse-glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
        </feMerge>
    </filter>
    
</defs>

<style>

:root {
    --bg: #000000;
    --bg-card: #0F0F11;
    --border: #262628;
    --text: #EEEEEE;
    --text-muted: #8A8F98;
    --accent: #5E6AD2;
    --accent-green: #4DA269;
    --accent-purple: #8A63D2;
    --accent-orange: #E36C2F;
    --sparkline: #5E6AD2;
    --sparkline-fill: rgba(94, 106, 210, 0.1);
}

/* Light mode override */
@media (prefers-color-scheme: light) {
    :root {
        --bg: #FFFFFF;
        --bg-card: #F7F7F9;
        --border: #EBEBEF;
        --text: #111113;
        --text-muted: #687076;
        --accent: #5E6AD2;
        --accent-green: #2F8E4B;
        --accent-purple: #793EE8;
        --accent-orange: #C54E00;
        --sparkline: #5E6AD2;
        --sparkline-fill: rgba(94, 106, 210, 0.1);
    }
}

body {
    font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
    margin: 0;
}

.card {
    fill: url(#card-bg-grad);
    stroke: url(#card-border-grad);
    stroke-width: 1.5px;
    rx: 12px;
    filter: url(#shadow3d);
}

.title {
    font-size: 16px;
    font-weight: 600;
    fill: var(--accent);
}

.label {
    font-size: 13px;
    fill: var(--text-muted);
}

.value {
    font-size: 13px;
    font-weight: 600;
    fill: var(--text);
}


    .divider-line {
        fill: none;
        stroke: url(#div-grad);
        stroke-width: 1.5px;
        stroke-linecap: round;
        opacity: 0.8;
    }
    .divider-pulse {
        fill: var(--accent);
        filter: url(#pulse-glow);
    }
    .divider-star {
        fill: var(--accent-purple);
        opacity: 0.6;
    }
    
</style>
<line x1="20" y1="15" x2="755" y2="15" class="divider-line" />

    <circle cx="20" cy="15" r="4" class="divider-pulse">
        <animate attributeName="cx" values="20; 755; 20" dur="8s" repeatCount="indefinite" />
        <animate attributeName="r" values="3; 5; 3" dur="2s" repeatCount="indefinite" />
    </circle>
    

    <circle cx="755" cy="15" r="3" fill="var(--accent-purple)" filter="url(#pulse-glow)">
        <animate attributeName="cx" values="755; 20; 755" dur="10s" repeatCount="indefinite" />
    </circle>
    

        <circle cx="100" cy="15" r="1.5" class="divider-star">
            <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" begin="0s" repeatCount="indefinite" />
            <animate attributeName="r" values="1; 2; 1" dur="2.5s" begin="0s" repeatCount="indefinite" />
        </circle>
        

        <circle cx="250" cy="15" r="1.5" class="divider-star">
            <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" begin="0.5s" repeatCount="indefinite" />
            <animate attributeName="r" values="1; 2; 1" dur="2.5s" begin="0.5s" repeatCount="indefinite" />
        </circle>
        

        <circle cx="400" cy="15" r="1.5" class="divider-star">
            <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" begin="1s" repeatCount="indefinite" />
            <animate attributeName="r" values="1; 2; 1" dur="2.5s" begin="1s" repeatCount="indefinite" />
        </circle>
        

        <circle cx="550" cy="15" r="1.5" class="divider-star">
            <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" begin="1.5s" repeatCount="indefinite" />
            <animate attributeName="r" values="1; 2; 1" dur="2.5s" begin="1.5s" repeatCount="indefinite" />
        </circle>
        

        <circle cx="680" cy="15" r="1.5" class="divider-star">
            <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" begin="2s" repeatCount="indefinite" />
            <animate attributeName="r" values="1; 2; 1" dur="2.5s" begin="2s" repeatCount="indefinite" />
        </circle>
        
</svg>