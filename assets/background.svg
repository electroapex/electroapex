<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 954 130" width="100%" height="100%" style="border-radius: 8px;">
<defs>

    <linearGradient id="card-bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="var(--bg-card)" stop-opacity="0.95" />
        <stop offset="100%" stop-color="var(--bg-card)" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="card-border-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.2)" />
        <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
        

    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0f172a" />
        <stop offset="60%" stop-color="#0d1117" />
        <stop offset="100%" stop-color="#1e152a" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00D4AA" />
        <stop offset="50%" stop-color="#bc8cff" />
        <stop offset="100%" stop-color="#ff7b72" />
    </linearGradient>
    <pattern id="banner-grid-pat" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" class="banner-grid" />
    </pattern>
    
</defs>

<style>

@font-face {
    font-family: 'JetBrains Mono';
    src: url(data:font/woff2;charset=utf-8;base64,) format('woff2');
    font-weight: normal;
    font-style: normal;
}


:root {
    --bg: #000000;
    --bg-card: #0F0F11;
    --border: #262628;
    --text: #EEEEEE;
    --text-muted: #8A8F98;
    --accent: #5E6AD2;
    --accent-green: #4DA269;
    --accent-purple: #8A63D2;
    --accent-orange: #E36C2F;
    --sparkline: #5E6AD2;
    --sparkline-fill: rgba(94, 106, 210, 0.1);
}

/* Light mode override */
@media (prefers-color-scheme: light) {
    :root {
        --bg: #FFFFFF;
        --bg-card: #F7F7F9;
        --border: #EBEBEF;
        --text: #111113;
        --text-muted: #687076;
        --accent: #5E6AD2;
        --accent-green: #2F8E4B;
        --accent-purple: #793EE8;
        --accent-orange: #C54E00;
        --sparkline: #5E6AD2;
        --sparkline-fill: rgba(94, 106, 210, 0.1);
    }
}

body {
    font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
    margin: 0;
}

.card {
    fill: url(#card-bg-grad);
    stroke: url(#card-border-grad);
    stroke-width: 1.5px;
    rx: 12px;
    filter: url(#shadow3d);
}

.title {
    font-size: 16px;
    font-weight: 600;
    fill: var(--accent);
}

.label {
    font-size: 13px;
    fill: var(--text-muted);
}

.value {
    font-size: 13px;
    font-weight: 600;
    fill: var(--text);
}


    .banner-title {
        font-family: 'JetBrains Mono', -apple-system, sans-serif;
        font-size: 26px;
        font-weight: 800;
        fill: url(#text-grad);
        letter-spacing: 4px;
        opacity: 0;
        transform: translateY(-10px);
        animation: bannerFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }
    .banner-subtitle {
        font-family: 'JetBrains Mono', -apple-system, sans-serif;
        font-size: 13px;
        fill: #8b949e;
        letter-spacing: 2px;
        opacity: 0;
        transform: translateY(-10px);
        animation: bannerFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }
    .banner-tag {
        opacity: 0;
        animation: bannerFadeInSimple 0.8s ease-out 0.8s forwards;
    }
    .banner-grid {
        stroke: rgba(255, 255, 255, 0.03);
        stroke-width: 1px;
    }
    @keyframes bannerFadeIn {
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bannerFadeInSimple {
        to { opacity: 0.7; }
    }
    
</style>

    <rect width="954" height="130" fill="url(#bg-grad)" />
    <rect width="954" height="130" fill="url(#banner-grid-pat)" />
    <circle cx="10%" cy="50%" r="90" fill="#00D4AA" opacity="0.08" filter="blur(20px)" />
    <circle cx="85%" cy="30%" r="80" fill="#bc8cff" opacity="0.08" filter="blur(20px)" />
    
    <g transform="translate(45, 0)">
        <text x="0" y="60" class="banner-title">M. HUIZAIFA HAFEEZ</text>
        <text x="0" y="88" class="banner-subtitle">Full Stack Developer &amp; Open Source Enthusiast</text>
        <text x="0" y="108" font-family="'JetBrains Mono'" font-size="10" fill="#00D4AA" class="banner-tag">&lt;developer status="active" /&gt;</text>
    </g>
    
</svg>