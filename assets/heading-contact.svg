<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 55" width="100%" height="100%" style="border-radius: 8px;">
<defs>

    <linearGradient id="heading-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity="1" />
        <stop offset="40%" stop-color="var(--accent-purple)" stop-opacity="0.8" />
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0" />
    </linearGradient>
    
</defs>

<style>

@font-face {
    font-family: 'JetBrains Mono';
    src: url(data:font/woff2;charset=utf-8;base64,) format('woff2');
    font-weight: normal;
    font-style: normal;
}


:root {
    --bg: #0d1117;
    --bg-card: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-muted: #8b949e;
    --accent: #00D4AA;
    --accent-green: #3fb950;
    --accent-purple: #bc8cff;
    --accent-orange: #f0883e;
    --sparkline: #00D4AA;
    --sparkline-fill: rgba(0, 212, 170, 0.05);
}

/* Light mode override */
@media (prefers-color-scheme: light) {
    :root {
        --bg: #ffffff;
        --bg-card: #f6f8fa;
        --border: #d0d7de;
        --text: #24292f;
        --text-muted: #57606a;
        --accent: #00a37b;
        --accent-green: #1a7f37;
        --accent-purple: #8250df;
        --accent-orange: #bc4c00;
        --sparkline: #00a37b;
        --sparkline-fill: rgba(0, 163, 123, 0.05);
    }
}

body {
    font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
    margin: 0;
}

.card {
    fill: var(--bg-card);
    stroke: var(--border);
    stroke-width: 1px;
    rx: 8px;
}

.title {
    font-size: 16px;
    font-weight: 600;
    fill: var(--accent);
}

.label {
    font-size: 13px;
    fill: var(--text-muted);
}

.value {
    font-size: 13px;
    font-weight: 600;
    fill: var(--text);
}


    .heading-text {
        font-family: 'JetBrains Mono', -apple-system, sans-serif;
        font-size: 22px;
        font-weight: 700;
        fill: var(--text);
    }
    .heading-prefix {
        font-family: 'JetBrains Mono', -apple-system, sans-serif;
        font-size: 22px;
        font-weight: 700;
        fill: var(--accent);
    }
    .heading-line {
        stroke: url(#heading-grad);
        stroke-width: 3px;
        stroke-linecap: round;
        stroke-dasharray: 300;
        stroke-dashoffset: 300;
        animation: drawUnderline 1.2s ease-out forwards;
    }
    @keyframes drawUnderline {
        to { stroke-dashoffset: 0; }
    }
    
</style>

    <text x="10" y="32">
        <tspan class="heading-prefix">## </tspan>
        <tspan class="heading-text">Get in Touch</tspan>
    </text>
    <line x1="10" y1="42" x2="210" y2="42" class="heading-line" />
    
</svg>