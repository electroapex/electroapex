name: Update Profile SVGs

on:
  schedule:
    - cron: '0 0 * * *' # Run nightly at midnight UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-svgs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_headings.py
          python scripts/generate_portrait.py
          python scripts/generate_stats.py
          python scripts/generate_year.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Check if assets have changed
          if git status --porcelain assets/ | grep -q 'assets/'; then
            git add assets/
            git commit -m "Auto-update profile SVGs [skip ci]"
            git push
            echo "Changes committed and pushed."
          else
            echo "No changes in SVGs. Skipping commit."
          fi
